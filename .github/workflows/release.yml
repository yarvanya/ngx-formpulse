name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Decide whether to publish
        id: decision
        run: |
          VERSION=$(node -p "require('./projects/ngx-formpulse/package.json').version")
          MAJOR=${VERSION%%.*}
          PUBLISHED=$(npm view "ngx-formpulse@${VERSION}" version 2>/dev/null || true)
          if [ "$MAJOR" -ge 1 ] && [ -z "$PUBLISHED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - if: steps.decision.outputs.publish == 'true'
        run: npm publish ./dist/ngx-formpulse --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.decision.outputs.publish == 'true'
        name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          awk -v version="$VERSION" '$0 ~ "^## \[?" version {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file release-notes.md
      - if: steps.decision.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sandbox/browser
      - if: steps.decision.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
