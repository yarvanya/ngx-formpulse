<mat-form-field appearance="outline" class="live-field" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <input matInput type="text" autocomplete="off" [formControl]="control()">
  <fp-validity-indicator matSuffix [isValid]="errors() === null" />
  <mat-error>{{ errors() | formControlsErrorsResolver }}</mat-error>
</mat-form-field>
<fp-error-view [errors]="errors()" />
