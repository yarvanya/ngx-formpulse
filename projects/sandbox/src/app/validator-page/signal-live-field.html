<mat-form-field appearance="outline" class="live-field" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <input matInput type="text" autocomplete="off" [formField]="field()">
  <fp-validity-indicator matSuffix [isValid]="errors().length === 0" />
  <mat-error>{{ errors() | formControlsErrorsResolver }}</mat-error>
</mat-form-field>
<fp-error-view [errors]="plainErrors().length > 0 ? plainErrors() : null" />
